name: Benchmark

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.org'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }} with duckdb ${{ matrix.duckdb }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        lisp: [sbcl-bin, ccl-bin/1.13, ecl/26.5.5]
        os: [ubuntu-latest]
        duckdb: [2.0.0, nightly]
    env:
      LISP: ${{ matrix.lisp }}
      DUCKDB_VERSION: ${{ matrix.duckdb }}
    steps:
      - uses: actions/checkout@v5

      - name: Install DuckDB
        shell: bash
        run: |
          if [ "${DUCKDB_VERSION}" = 'nightly' ]; then
            aria2c -o duckdb-shared-libs-linux-amd64.tar.gz "https://artifacts.duckdb.org/v2.0-cyanoptera/duckdb-shared-libs-linux-amd64.tar.gz"
          else
            aria2c -o duckdb-shared-libs-linux-amd64.tar.gz "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb-shared-libs-linux-amd64.tar.gz"
          fi
          tar -xzf duckdb-shared-libs-linux-amd64.tar.gz

      - name: Setup Lisp
        uses: 40ants/setup-lisp@v4
        with:
          cache: true

      - name: Run benchmarks
        shell: bash
        run: |
          export LD_LIBRARY_PATH=./
          export CL_DUCKDB_USE_SFFI=t
          export CL_DUCKDB_LIBRARY_PATH="${{ github.workspace }}"
          ros --eval '(ql-dist:install-dist "http://dist.ultralisp.org/" :prompt nil)' --eval '(uiop:quit)'
          ros install neil-lindquist/ci-utils
          asdf-register-project
          ros --eval '
            (handler-case
                (progn
                  (format t "~&Benchmark source: ~A~%" (asdf:system-source-directory :duckdb))
                  (ql:quickload :duckdb/benchmark)
                  (asdf:test-system :duckdb/benchmark)
                  (uiop:quit 0))
              (error (condition)
                (format *error-output* "~&Benchmark failed: ~A~%" condition)
                (uiop:quit 1)))'
